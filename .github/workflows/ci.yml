name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: inventario, POSTGRES_USER: inventario, POSTGRES_PASSWORD: inventario }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://inventario:inventario@localhost:5432/inventario
      SECRET_KEY: ci
      DEBUG: "False"
      SECURE_SSL_REDIRECT: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest
      - name: Revisión de seguridad para producción
        run: python manage.py check --deploy --fail-level WARNING
        env:
          SECRET_KEY: ${{ github.run_id }}-clave-de-prueba-larga-y-aleatoria-para-check-deploy-0123456789
          ALLOWED_HOSTS: inventario.example.com
          SECURE_SSL_REDIRECT: "True"  # revisa la configuración real de producción, no la de pruebas
