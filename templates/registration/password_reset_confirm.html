{% extends "base.html" %}
{% block titulo %}Nueva contraseña{% endblock %}
{% block contenido %}<section class="tarjeta formulario formulario-libre" style="max-width:460px;margin-top:2rem"><h1>Nueva contraseña</h1>{% if validlink %}<form method="post">{% csrf_token %}{{ form.as_p }}<button class="boton">Guardar</button></form>{% else %}<p>El enlace ya no es válido. <a href="{% url 'password_reset' %}">Pide uno nuevo</a>.</p>{% endif %}</section>{% endblock %}
