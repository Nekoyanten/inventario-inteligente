{% extends "base.html" %}
{% block titulo %}Reportes{% endblock %}
{% block contenido %}
<div class="encabezado"><h1>Reportes</h1><a class="boton boton-auto boton-chico boton-secundario" href="{% url 'reportes:importar' %}">Importar productos</a></div>
{% for grupo, reportes in grupos.items %}
<h2>{{ grupo }}</h2>
<div class="rejilla">
  {% for r in reportes %}
  <a class="tarjeta" href="{% url 'reportes:ver' r.clave %}" style="text-decoration:none;color:inherit">
    <strong>{{ r.titulo }}</strong><p class="suave" style="margin:.3rem 0 0">{{ r.descripcion }}</p>
  </a>
  {% endfor %}
</div>
{% endfor %}
{% endblock %}
