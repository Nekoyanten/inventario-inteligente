{% load ui %}{% if pagina.has_other_pages %}
<nav class="paginacion">
  {% if pagina.has_previous %}<a href="{% url_con pagina=pagina.previous_page_number %}">← Anterior</a>{% endif %}
  <span>Página {{ pagina.number }} de {{ pagina.paginator.num_pages }}</span>
  {% if pagina.has_next %}<a href="{% url_con pagina=pagina.next_page_number %}">Siguiente →</a>{% endif %}
</nav>
{% endif %}
