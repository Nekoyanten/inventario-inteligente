{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<section class="tarjeta formulario formulario-libre">
  <h1>{{ titulo }}</h1>
  <form method="post">{% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_p }}
    <button class="boton">Guardar</button>
  </form>
  <p><a href="{% url 'usuarios:lista' %}">← Volver</a></p>
</section>
{% endblock %}
