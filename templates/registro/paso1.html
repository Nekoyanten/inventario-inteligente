{% extends "base.html" %}
{% block titulo %}Crear cuenta{% endblock %}
{% block contenido %}
<section class="tarjeta formulario">
  <p class="pasos">Paso 1 de 2</p>
  <h1>Tu negocio</h1>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button class="boton">Siguiente →</button>
  </form>
  <p>¿Ya tienes cuenta? <a href="{% url 'login' %}">Ingresa</a></p>
</section>
{% endblock %}
