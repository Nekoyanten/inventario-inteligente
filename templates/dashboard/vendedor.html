{% extends "base.html" %}{% load ui %}
{% block titulo %}Inicio{% endblock %}
{% block contenido %}
<h1>Hola, {{ user.first_name|default:user.username }}</h1>
<div class="rejilla">
  <section class="tarjeta"><h2>Tus ventas de hoy</h2><p class="kpi">{{ resumen.hoy|moneda }}</p><p class="suave">{{ resumen.numero_hoy }} ventas</p></section>
</div>
<div class="acciones">
  <a class="boton boton-auto" href="{% url 'ventas:pos' %}">🧾 Nueva venta</a>
  <a class="boton boton-auto boton-secundario" href="{% url 'catalogo:lista' %}">📦 Consultar disponibilidad</a>
</div>
{% endblock %}
